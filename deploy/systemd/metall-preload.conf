# nix-daemon.service drop-in: serves the daemon's heap from Metall.
#
# deploy/install.sh installs this as
#   /etc/systemd/system/nix-daemon.service.d/metall-preload.conf
# with @LIB@ and @HEAP_DIR@ filled in. To install it by hand, substitute them
# and run `systemctl daemon-reload && systemctl restart nix-daemon.service`.
[Service]
Environment=LD_PRELOAD=@LIB@
Environment=METALL_PRELOAD_DIR=@HEAP_DIR@
